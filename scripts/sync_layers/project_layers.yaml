# ┌─────────────────┬─────────┬────────────────┬──────────────┬───────────────┬───────────────┬─────────┬────────────────┐
# │                 │  inp()  │ User signature │ Global frame │ _arg_default  │  tput / tget  │ Logging │ Canonical call │
# ├─────────────────┼─────────┼────────────────┼──────────────┼───────────────┼───────────────┼─────────┼────────────────┤
# │ Normal arg      │    ✓    │       ✓        │      ✓       │       ✓       │       ✓       │    ✓    │       ✓        │
# │ hidden_args     │    ✗    │       ✓        │      ✓       │       ✓       │       ✓       │    ✓    │       ✓        │
# │ layer_args      │    ✗    │       ✗        │      ✗       │       ✗       │       ✗       │    ✗    │   ✓ (injected) │
# └─────────────────┴─────────┴────────────────┴──────────────┴───────────────┴───────────────┴─────────┴────────────────┘
sources:
  - file:  cubevis/toolbox/visplot/visibility_plotter.py
    class: VisibilityPlotter
    hidden_args:
      - backend
      # a dict of Python callables: settable from Python, not from inp()
      - flag_filters
    layer_args:
      remote_endpoint: None
      enable_flagging: True
      headless: False
      # the task opens a browser tab: a websocket, even from a notebook kernel
      transport: "'websocket'"
    short_desc_overrides:
      mode:        'Display mode: both, raster, or scatter.'
      preset:      'Named startup preset (vplot, radplot, waterfall).'
      kernel_name: 'Remote kernel to run data access/rendering on (cubevis.remote).'
      time_gaps:   'Gaps on a Time axis (between scans): shown, or closed (removed).'
      freq_gaps:   'Gaps on a frequency axis (between spectral windows): shown, or closed (removed).'
    methods:
      - __init__
      - __call__
      - show

templates:
  - input:  templates/casatask_layer.py.j2
    output: cubevis/private/casatasks/visplot.py
    vars:
      task_name:  visplot
      app_module: cubevis.toolbox.visplot.visibility_plotter
      info_group: visualization, information,editing, manipulation
      info_desc:  A plotter/interactive flagger for visibility data

  - input:  templates/casashell_layer.py.j2
    output: cubevis/private/casashell/visplot.py
    vars:
      task_name:  visplot
      app_module: cubevis.toolbox.visplot.visibility_plotter
      # inp() shows a preference-backed argument left at None as the value
      # it comes to (layer_defaults() there, issue 6); None is still what
      # is passed and saved in visplot.last
      prefs_module: cubevis.toolbox.visplot.prefs
      info_group: visualization, information,editing, manipulation
      info_desc:  A plotter/interactive flagger for visibility data

# Tasks that the published documentation includes text from (the task-doc and
# task-params directives, docs/source/extensions/pydoc_include.py) but whose
# layers are NOT generated here.  sync_layers ignores this section; every
# task under `templates` above is available to the documentation already.
documentation:
  # generated by scripts/expand_templates from tclean's task XML
  - task:   iclean
    file:   cubevis/private/casatasks/iclean.py
    class:  _iclean
    method: __call__
