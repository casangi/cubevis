# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Read the Docs builds the same Sphinx source as GitHub Pages
# (.github/workflows/docs.yml).  When https://casangi.github.io/cubevis/ is
# ready to be the only copy, replace this file with
# docs/readthedocs-redirect.yaml: every page here then forwards to the same
# page there.
version: 2

sphinx:
   configuration: docs/source/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
   install:
   - requirements: docs/requirements.txt
