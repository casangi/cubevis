[pytest]
# Optional convenience config, scoped to this directory only -- pytest
# picks this up when test paths point inside cubevis/remote/tests/, and
# it won't interfere with any repo-wide pytest.ini/pyproject.toml
# elsewhere (pytest uses whichever config file it finds first walking up
# from the given test paths).
#
# Not actually required: every async test in this suite is already
# explicitly @pytest.mark.asyncio-decorated, so the whole suite passes
# under pytest-asyncio's stricter default (Mode.STRICT) with no config
# at all -- verified in a from-scratch run with this file absent. This
# just saves typing `-p asyncio_mode=auto` or similar if you'd rather not
# mark every test explicitly in future additions here.
asyncio_mode = auto
