# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The cubevis documentation is published on GitHub Pages
# (.github/workflows/docs.yml).  https://cubevis.readthedocs.io/ only
# forwards there: Read the Docs runs docs/rtd_redirect.py instead of Sphinx,
# which writes one small page for every page of the documentation, each
# forwarding to the same page on https://casangi.github.io/cubevis/, so
# existing links and bookmarks keep working.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python docs/rtd_redirect.py "$READTHEDOCS_OUTPUT/html"
