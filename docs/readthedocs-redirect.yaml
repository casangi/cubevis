# Read the Docs configuration that publishes only redirects to GitHub Pages.
#
# To switch https://cubevis.readthedocs.io/ over, copy this file to
# .readthedocs.yaml at the top of the repository:
#
#     cp docs/readthedocs-redirect.yaml .readthedocs.yaml
#
# Read the Docs then runs docs/rtd_redirect.py instead of Sphinx.  It writes
# one small page for every page of the documentation, each forwarding to
# the same page on https://casangi.github.io/cubevis/, so existing links and
# bookmarks keep working.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python docs/rtd_redirect.py "$READTHEDOCS_OUTPUT/html"
