<text x="958" y="170" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="white" text-anchor="start"  xml:space="preserve">Not here yet</text>
<text x="964" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C9711F" text-anchor="start"  xml:space="preserve">Jupyter notebooks</text>
<text x="964" y="254" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">JupyterLab and Colab. cubevis already talks over both;</text>
<text x="964" y="279.08" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">the visplot window does not yet run in a notebook.</text>
<text x="964" y="334.15999999999997" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C9711F" text-anchor="start"  xml:space="preserve">Calibration tables</text>
<text x="964" y="366.15999999999997" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">What SNPLT, POSSM on BP tables, plotbandpass and plotms</text>
<text x="964" y="391.23999999999995" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">on cal tables show. Solutions are per antenna, not per</text>
<text x="964" y="416.31999999999994" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">baseline, so this needs its own data model.</text>
<text x="964" y="471.3999999999999" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C9711F" text-anchor="start"  xml:space="preserve">Iteration over pages</text>
<text x="964" y="503.3999999999999" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">plotms's iteraxis: one plot per antenna, baseline, SPW</text>
<text x="964" y="528.4799999999999" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">or scan, laid out in a grid. visplot has two panels and</text>
<text x="964" y="553.56" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">steps through antennas and baselines with Prev / Next.</text>
<text x="964" y="608.64" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C9711F" text-anchor="start"  xml:space="preserve">Elevation and angle axes</text>
<text x="964" y="640.64" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">Elevation, hour angle, azimuth and parallactic angle, as</text>
<text x="964" y="665.72" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#1C2733" text-anchor="start"  xml:space="preserve">plotms offers.</text>
<text x="40" y="62" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1C2733" text-anchor="start"  xml:space="preserve">Under the hood, and what is next</text>
<text x="40" y="102" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#4A5563" text-anchor="start"  xml:space="preserve">One reader interface over both data formats; images made in Python, drawn by Bokeh in the browser, no Bokeh server.</text>
<text x="1560" y="885" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#8A94A0" text-anchor="end" font-style="italic" xml:space="preserve">Scope as of the visplot user guide, 18 Oct 2026 · visplot test release · October 2026</text>
